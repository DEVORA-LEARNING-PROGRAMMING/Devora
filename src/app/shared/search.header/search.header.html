<header class="topbar">
  <div class="search-container">
    <span class="search-icon">⌕</span>

    <input
      type="text"
      id="searchInput"
      placeholder="Search Courses and Lessons"
      autocomplete="off"
      [(ngModel)]="searchQuery"
      (input)="onSearchInput()"
      (focus)="onSearchInput()"
    />

    <div id="autocomplete" class="autocomplete" *ngIf="showAutocomplete">
      <div
        *ngFor="let title of suggestions"
        class="autocomplete-item"
        (click)="selectSuggestion(title)"
      >
        {{ title }}
      </div>
    </div>
  </div>

  <div class="topbar-actions">
    <span class="notification">♧</span>
    <div class="user-avatar">
      Ys
    </div>
  </div>
</header>
