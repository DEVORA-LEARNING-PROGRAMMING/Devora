<aside class="sidebar">

  <div class="brand">
    <div class="brand-icon">{{ brandIconLetter }}</div>
    {{ brandName }}
  </div>

  <ul class="nav-list">
    <li
      *ngFor="let item of navItems"
      class="nav-item"
      [class.logout-item]="item.isLogout"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <a [routerLink]="item.route" (click)="handleNavClick(item)">
        <i [class]="item.iconClass"></i>
        <span>{{ item.label }}</span>
      </a>
    </li>
  </ul>

</aside>
