<div class="page-layout">

  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Page -->
  <main class="page-content">

    <!-- Header -->
    <header class="page-header">
      <h1>Profile</h1>

      <div class="header-actions">
        <!-- Notification -->
        <svg
          class="notification-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
          />
          <path d="M10 21h4" />
        </svg>

        <!-- Header Avatar -->
        <div class="header-avatar">
          {{ initials }}
        </div>
      </div>
    </header>


    <!-- Page Content -->
    <section class="profile-content">

      <!-- Profile Header Card -->
      <div class="profile-header">

        <div class="avatar avatar--lg">
          {{ initials }}
        </div>

        <div class="profile-header__info">
          <h2>{{ fullName }}</h2>

          <p class="profile-header__meta">
            @{{ username }} · {{ email }}
          </p>

          <p class="profile-header__bio">
            {{ bio }}
          </p>
        </div>

        <a routerLink="/student/settings" class="edit-btn">
          Edit Profile
        </a>

      </div>


      <!-- Statistics -->
      <div class="stats-grid">

        <div class="stat-card" *ngFor="let stat of stats">
          <div class="stat-card__value">
            {{ stat.value }}
          </div>

          <div class="stat-card__label">
            {{ stat.label }}
          </div>
        </div>

      </div>


      <!-- Achievements -->
      <h2 class="achievements-title">
        Achievements
      </h2>

      <div class="achievements-container">

        <div
          class="achievement-row"
          *ngFor="let achievement of achievements"
        >

          <!-- Icon -->
          <div
            class="achievement-icon"
            [style.background]="achievement.iconBg"
          >

            <!-- HTML -->
            <svg
              *ngIf="achievement.icon === 'html'"
              viewBox="0 0 24 24"
              fill="white"
            >
              <path
                d="M1.5 0h21l-1.91 21.563L11.977 24l-8.564-2.438L1.5 0zm7.031 9.75-.232-2.718 10.059.003.23-2.622L5.412 4.41l.698 8.01h9.126l-.326 3.426-2.91.804-2.955-.81-.188-2.11H6.248l.33 4.171L12 19.351l5.379-1.443.744-8.157H8.531z"
              />
            </svg>

            <!-- CSS -->
            <svg
              *ngIf="achievement.icon === 'css'"
              viewBox="0 0 24 24"
              fill="white"
            >
              <path
                d="M1.5 0h21l-1.91 21.563L11.977 24l-8.565-2.438L1.5 0zm17.09 4.413L5.41 4.41l.213 2.622 10.125.002-.255 2.716h-6.64l.24 2.573h6.182l-.366 3.523-2.91.804-2.956-.81-.188-2.11h-2.61l.29 3.855L12 19.288l5.373-1.53L18.59 4.414z"
              />
            </svg>

            <!-- JS -->
            <span *ngIf="achievement.icon === 'js'">
              JS
            </span>

          </div>


          <!-- Achievement Info -->
          <div class="achievement-info">

            <h3>
              {{ achievement.title }}
            </h3>

            <p>
              Finished {{ achievement.finishedOn }}
            </p>

          </div>


          <!-- View Button -->
          <button
            type="button"
            class="view-btn"
            (click)="onViewAchievement(achievement)"
            routerLink="/student/courses"
          >
            View
          </button>

        </div>

      </div>

    </section>

  </main>

</div>
