<app-admin-sidebar></app-admin-sidebar>
<main class="content">
  <app-search-header></app-search-header>
  <h1 class="page-title">Manage Courses</h1>



  <div class="courses-list">
    <div class="course-card" *ngFor="let course of filteredCourses">
      <div class="course-brand" [ngClass]="course.brandClass" [ngSwitch]="course.icon">

        <svg *ngSwitchCase="'html5'" class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 4h28l-2.6 29L20 37 6.6 33z" fill="#E44D26"/>
          <path d="M20 6.7V34.6l6.9-1.9 2.2-24z" fill="#F16529"/>
          <text x="20" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
        </svg>

        <svg *ngSwitchCase="'css3'" class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 4h28l-2.6 29L20 37 6.6 33z" fill="#1572B6"/>
          <path d="M20 6.7V34.6l6.9-1.9 2.2-24z" fill="#33A9DC"/>
          <text x="20" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
        </svg>

        <svg *ngSwitchCase="'javascript'" class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="6" fill="#F7DF1E"/>
          <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#000" text-anchor="middle">JS</text>
        </svg>

        <svg *ngSwitchCase="'cpp'" class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <polygon points="20,2 35,10.5 35,29.5 20,38 5,29.5 5,10.5" fill="#00599C"/>
          <text x="20" y="24" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">C++</text>
        </svg>

        <svg *ngSwitchCase="'react'" class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="#20232A"/>
          <g transform="translate(20,20)" fill="none" stroke="#61DAFB" stroke-width="1.5">
            <ellipse rx="11" ry="4.5"/>
            <ellipse rx="11" ry="4.5" transform="rotate(60)"/>
            <ellipse rx="11" ry="4.5" transform="rotate(120)"/>
          </g>
          <circle cx="20" cy="20" r="2.5" fill="#61DAFB"/>
        </svg>

        <svg *ngSwitchCase="'python'" class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="#fff"/>
          <path d="M19.5 5c-5 0-4.7 2.2-4.7 2.2v3.1h4.8v.9H8.9S5 10.7 5 15.8s3.4 4.9 3.4 4.9h2v-2.8s-.1-3.4 3.3-3.4h6.7s3.2.1 3.2-3.1V8.2S24 5 19.5 5z" fill="#3776AB"/>
          <path d="M20.5 35c5 0 4.7-2.2 4.7-2.2v-3.1h-4.8v-.9h10.7s3.9.5 3.9-4.6-3.4-4.9-3.4-4.9h-2v2.8s.1 3.4-3.3 3.4h-6.7s-3.2-.1-3.2 3.1v5.2S16 35 20.5 35z" fill="#FFD43B"/>
          <circle cx="17" cy="8.3" r="1" fill="#fff"/>
          <circle cx="23" cy="31.7" r="1" fill="#fff"/>
        </svg>

        <svg *ngSwitchCase="'java'" class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="8" fill="#fff"/>
          <path d="M13 24h14a2 2 0 0 1 2 2 4 4 0 0 1-4 4H15a4 4 0 0 1-4-4 2 2 0 0 1 2-2z" fill="#5382A1"/>
          <path d="M27 25.5h1.5a2.5 2.5 0 0 1 0 5H27" fill="none" stroke="#5382A1" stroke-width="1.5"/>
          <path d="M16 21c-1 1-1 2 .5 3M20 21c-1 1-1 2 .5 3M24 21c-1 1-1 2 .5 3" stroke="#E76F00" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        </svg>

        <ng-container *ngSwitchDefault>{{ course.brandText }}</ng-container>

      </div>
      
      <div class="course-details">
        <h3>{{ course.title }}</h3>
        <p class="author">
          <i class="fa-solid fa-user"></i> by {{ course.author }}
        </p>
        <div class="course-meta">
          <span><i class="fa-regular fa-clock"></i> {{ course.duration }}</span>
          <span><i class="fa-solid fa-book-open"></i> {{ course.lessonsCount }} lessons</span>
          <span class="rating"><i class="fa-solid fa-star"></i> {{ course.rating }}</span>
        </div>
      </div>
      
      <button type="button" class="btn-check" (click)="onCheckCourse(course)">
        <i class="fa-regular fa-calendar-days"></i> Check Date
      </button>
    </div>
  </div>

    <div class="action-buttons">
    <a routerLink="/admin/add-course" class="btn btn-primary">
       Add Courses
    </a>
    <a routerLink="/admin/delete-course" class="btn btn-secondary">
       Delete Courses
    </a>
  </div>
</main>
