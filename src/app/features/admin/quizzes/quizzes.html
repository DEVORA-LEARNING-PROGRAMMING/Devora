<app-admin-sidebar></app-admin-sidebar>


<div class="main-wrapper">
  <header class="header">
    <a routerLink="/admin/manage-courses" class="back-link">&larr; Back To Courses</a>
    <div class="header-actions">
      <button class="icon-btn" type="button" title="icon">
        <svg viewBox="0 0 448 512" width="18" height="18" fill="currentColor">
          <path d="M224 0c-17.7 0-32 14.3-32 32V51.2C119.5 66 64 130.6 64 208v18.8c0 47-17.3 92.4-48.5 127.6l-7.4 8.3c-8.4 9.4-10.4 22.9-5.3 34.4S19.4 416 32 416H416c12.6 0 24-7.4 29.2-18.9s3.1-25-5.3-34.4l-7.4-8.3C401.3 319.2 384 273.9 384 226.8V208c0-77.4-55.5-142-128-156.8V32c0-17.7-14.3-32-32-32zm0 96c61.9 0 112 50.1 112 112v18.8c0 47.6 13.9 94 39.7 133.2H72.3C98.1 320.8 112 274.4 112 226.8V208c0-61.9 50.1-112 112-112zm64 352H160c0 17 6.7 33.3 18.7 45.3S207 512 224 512s33.3-6.7 45.3-18.7S288 465 288 448z"/>
        </svg>
      </button>
      <div class="user-avatar"><a href="#profile">Ys</a></div>
    </div>
  </header>

  <main class="content">
    <div class="top-section">
      <h1 class="page-title">Quizzes Management</h1>
      <button class="btn-primary" (click)="openAddModal()">
        <svg viewBox="0 0 448 512" width="14" height="14" fill="currentColor">
          <path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/>
        </svg>
        Create New Quiz
      </button>
    </div>

    <!-- Quizzes Grid -->
    <div class="quizzes-grid">
      <div class="quiz-card" *ngFor="let quiz of quizzes">
        <div class="quiz-card-header">
          <span class="badge" [ngClass]="quiz.status === 'Active' ? 'badge-active' : 'badge-draft'">
            {{ quiz.status }}
          </span>
          <div class="card-actions">
            <button class="btn-icon-action edit-btn" (click)="openEditModal(quiz)" title="edit">
              <svg viewBox="0 0 512 512" width="14" height="14" fill="currentColor">
                <path d="M410.3 231l11.3-11.3-62.2-62.2-11.3 11.3 62.2 62.2zM452.7 189.5c25-25 25-65.5 0-90.5l-39.7-39.7c-25-25-65.5-25-90.5 0L52.1 329.7c-8.4 8.4-14.4 18.9-17.4 30.4L.4 487.4c-2.1 8 .2 16.5 6.1 22.4s14.4 8.2 22.4 6.1l127.3-34.3c11.5-3.1 22-9.1 30.4-17.4L452.7 189.5z"/>
              </svg>
            </button>
            <button class="btn-icon-action delete-btn" (click)="openDeleteModal(quiz.id)" title="delete">
              <svg viewBox="0 0 448 512" width="14" height="14" fill="currentColor">
                <path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"/>
              </svg>
            </button>
          </div>
        </div>
        <h3 class="quiz-title">{{ quiz.title }}</h3>
        <span class="quiz-course-tag">
          <svg viewBox="0 0 448 512" width="12" height="12" fill="currentColor">
            <path d="M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32z"/>
          </svg>
          {{ quiz.course }}
        </span>
        <div class="quiz-meta">
          <span>
            <svg viewBox="0 0 512 512" width="12" height="12" fill="currentColor">
              <path d="M256 0a256 256 0 1 1 0 512A256 256 0 1 1 256 0zM232 120V256c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2V120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/>
            </svg>
            {{ quiz.time }} Mins
          </span>
          <span>
            <svg viewBox="0 0 512 512" width="12" height="12" fill="currentColor">
              <path d="M0 48C0 21.5 21.5 0 48 0H80c26.5 0 48 21.5 48 48V80c0 26.5-21.5 48-48 48H48C21.5 128 0 106.5 0 80V48zM0 208c0-26.5 21.5-48 48-48H80c26.5 0 48 21.5 48 48v32c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V208zM128 400c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V368c0-26.5 21.5-48 48-48H80c26.5 0 48 21.5 48 48v32zM176 64c0-17.7 14.3-32 32-32H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H208c-17.7 0-32-14.3-32-32zm0 160c0-17.7 14.3-32 32-32H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H208c-17.7 0-32-14.3-32-32zm0 160c0-17.7 14.3-32 32-32H480c17.7 0 32 14.3 32 32s-14.3 32-32 32H208c-17.7 0-32-14.3-32-32z"/>
            </svg>
            {{ quiz.questions }} Questions
          </span>
        </div>
        <div class="quiz-footer">
          <span class="quiz-attempts">
            <svg viewBox="0 0 640 512" width="12" height="12" fill="currentColor">
              <path d="M96 128a128 128 0 1 1 256 0A128 128 0 1 1 96 128zM0 482.3C0 383.8 79.8 304 178.3 304h91.4C368.2 304 448 383.8 448 482.3c0 16.4-13.3 29.7-29.7 29.7H29.7C13.3 512 0 498.7 0 482.3z"/>
            </svg>
            {{ quiz.attempts }} Attempts
          </span>
          <button class="btn-secondary" type="button">View Details</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" [class.active]="isDeleteModalOpen">
  <div class="modal-box">
    <div class="modal-icon">
      <svg viewBox="0 0 448 512" width="20" height="20" fill="currentColor">
        <path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"/>
      </svg>
    </div>
    <h3>Delete Quiz</h3>
    <p>Are you sure you want to delete this quiz? This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="closeDeleteModal()" type="button">Cancel</button>
      <button class="btn-confirm" (click)="confirmDelete()" type="button">Delete</button>
    </div>
  </div>
</div>

<!-- Quiz Modal (Add / Edit) -->
<div class="modal-overlay" [class.active]="isQuizModalOpen">
  <div class="modal-box modal-form">
    <h3>{{ modalTitle }}</h3>
    <form [formGroup]="quizForm" (ngSubmit)="saveQuiz()">
      <div class="form-group">
        <label for="inputQuizTitle">Quiz Title</label>
        <input type="text" id="inputQuizTitle" formControlName="title" placeholder="e.g., HTML Fundamentals Quiz" />
      </div>
      <div class="form-group">
        <label for="inputCourseName">Course Name</label>
        <input type="text" id="inputCourseName" formControlName="course" placeholder="e.g., HTML COURSES" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="inputQuizTime">Duration (Mins)</label>
          <input type="number" id="inputQuizTime" formControlName="time" min="1" placeholder="20" />
        </div>
        <div class="form-group">
          <label for="inputQuizQuestions">Questions Count</label>
          <input type="number" id="inputQuizQuestions" formControlName="questions" min="1" placeholder="15" />
        </div>
      </div>
      <div class="form-group">
        <label for="inputQuizStatus">Status</label>
        <select id="inputQuizStatus" formControlName="status">
          <option value="Active">Active</option>
          <option value="Draft">Draft</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="closeQuizModal()">Cancel</button>
        <button type="submit" class="btn-primary-modal" [disabled]="quizForm.invalid">Save</button>
      </div>
    </form>
  </div>
</div>
