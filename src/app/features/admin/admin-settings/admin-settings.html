<app-admin-sidebar></app-admin-sidebar>
<div class="settings-wrapper">

  <div class="settings-card">

    <div class="title-container">
      <h2 class="card-title">Profile Settings</h2>
    </div>

    <div class="avatar-section">
      <div class="avatar-badge">
        {{ getInitials() }}
      </div>
      <button type="button" (click)="onChangePhoto()" class="btn-change-photo">
        Change photo
      </button>
    </div>

    <form (ngSubmit)="onSave()" class="form-grid">

      <div class="form-row-2col">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input
            type="text"
            [(ngModel)]="adminProfile.firstName"
            name="firstName"
            class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input
            type="text"
            [(ngModel)]="adminProfile.lastName"
            name="lastName"
            class="form-input" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">UserName</label>
        <input
          type="text"
          [(ngModel)]="adminProfile.userName"
          name="userName"
          class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          type="email"
          [(ngModel)]="adminProfile.email"
          name="email"
          class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label">Bio</label>
        <input
          type="text"
          [(ngModel)]="adminProfile.bio"
          name="bio"
          class="form-input form-input-sm" />
      </div>

      <hr class="divider" />

      <!-- Log Out Row
      <div class="logout-row">
        <div>
          <p class="logout-title">Log out</p>
          <p class="logout-subtitle">Sign out of Devora on this device</p>
        </div>
        <button type="button" (click)="onLogout()" class="btn-logout" routerLink="/admin/landing">
          Log out
        </button>
      </div> -->

      <div class="action-buttons">
        <button type="button" (click)="onCancel()" class="btn-cancel" routerLink="/admin/profile">
          Cancel
        </button>
        <button type="submit" class="btn-save" routerLink="/admin/profile">
          Save changes
        </button>
      </div>

    </form>
  </div>
</div>
